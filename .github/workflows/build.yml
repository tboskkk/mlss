name: Build

# The whole point of this workflow: prove, on every push, that a clean
# checkout still produces a byte-identical retail ROM. No baserom is needed
# here - the ROM is rebuilt entirely from the checked-in asm/C sources and
# checked against the committed rom.sha1.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build toolchain image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          tags: mlss-toolchain:ci
          push: false
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build ROM
        run: docker run --rm -v "${{ github.workspace }}:/workspace" mlss-toolchain:ci make

      - name: Verify ROM is byte-identical to retail
        run: sha1sum -c rom.sha1

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlss-build
          path: |
            mlss.gba
            mlss.elf
            mlss.map
          if-no-files-found: warn
          retention-days: 14
